<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LaunchReady" />
    <meta name="theme-color" content="#FAF8F6" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preload" href="/launchready_logo_white.png" as="image" />
    <title>LaunchReady - App Launch Checklist</title>
    <style>
      @keyframes splash-reveal-icon {
        0% {
          opacity: 0;
          transform: scale(0.93);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes splash-reveal-title {
        0% {
          opacity: 0;
          transform: scale(0.95);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      .lr-splash-icon {
        animation: splash-reveal-icon 1400ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        will-change: transform, opacity;
      }
      .lr-splash-title {
        animation: splash-reveal-title 1400ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body class="bg-[#FAF8F6] text-[#1E2022] antialiased selection:bg-slate-900 selection:text-white min-h-screen">
    <div id="root">
      <div style="position:fixed;inset:0;background:#000000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;overflow:hidden;">
        <div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 46%, rgba(255, 255, 255, 0.08) 0px, rgba(255, 255, 255, 0.02) 180px, transparent 320px);pointer-events:none;"></div>
        <div class="lr-splash-icon" style="position:relative;width:210px;height:210px;margin-top:-48px;display:flex;align-items:center;justify-content:center;">
          <img src="/launchready_logo_white.png" style="width:210px;height:210px;object-fit:contain;filter:drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5));" alt="LaunchReady" />
        </div>
        <div class="lr-splash-title" style="position:absolute;bottom:52px;left:0;right:0;text-align:center;">
          <span style="font-family:'Google Sans',-apple-system,BlinkMacSystemFont,sans-serif;font-size:34px;font-weight:500;color:#FFFFFF;letter-spacing:-0.3px;text-shadow:0 2px 6px rgba(0, 0, 0, 0.6);">LaunchReady</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
