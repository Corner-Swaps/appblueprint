<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="App Blueprint" />
    <meta name="theme-color" content="#FAF8F6" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>App Blueprint — Mobile Production OS</title>
    <style>
      @keyframes splash-reveal-icon {
        0% {
          opacity: 0;
          transform: scale(0.93);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes splash-reveal-title {
        0% {
          opacity: 0;
          transform: scale(0.95);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      .lr-splash-icon {
        animation: splash-reveal-icon 1400ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        will-change: transform, opacity;
      }
      .lr-splash-title {
        animation: splash-reveal-title 1400ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body class="bg-[#FAF8F6] text-[#1E2022] antialiased selection:bg-slate-900 selection:text-white min-h-screen">
    <div id="root">
      <div style="position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%, #FAF5FF 0%, #F3E8FF 40%, #E9D5FF 80%, #DDD6FE 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;overflow:hidden;">
        <div class="lr-splash-icon" style="position:relative;width:250px;height:250px;margin-top:-48px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 16px 36px rgba(126, 34, 206, 0.25));">
          <img src="/logo_purple.svg" style="width:250px;height:250px;display:block;" alt="App Blueprint" />
        </div>
        <div class="lr-splash-title" style="position:absolute;bottom:52px;left:0;right:0;text-align:center;">
          <span style="font-family:'Google Sans',-apple-system,BlinkMacSystemFont,sans-serif;font-size:34px;font-weight:700;color:#3B0764;letter-spacing:-0.3px;">App Blueprint</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
